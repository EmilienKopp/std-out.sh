name: /dev/null

on:
  push:
    branches: [main]

permissions: {}

jobs:
  commit:
    runs-on: ubuntu-slim
    steps:
      - uses: nunomaduro/dev-null.sh/.github/actions/commit@production
        with:
          body: |
            ${{ github.event.head_commit.message }}
            ${{ github.event.head_commit.url }}
          ssh-key: ${{ secrets.DEVNULL_SSH_KEY }}
